services:
  postgres:
    image: postgres:17-alpine
    container_name: dniproxp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dniproxp
      POSTGRES_PASSWORD: dniproxp_dev
      POSTGRES_DB: dniproxp
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dniproxp -d dniproxp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
